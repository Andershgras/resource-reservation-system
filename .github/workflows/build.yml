name: Build

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore ResourceReservationSystem.slnx

      - name: Restore .NET tools
        run: dotnet tool restore

      # Unit tests and integration tests. The integration tests start SQL Server
      # in Docker through Testcontainers, which GitHub-hosted runners support.
      - name: Test backend
        run: >
          dotnet test ResourceReservationSystem.slnx --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/coverage/raw

      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          -reports:"TestResults/coverage/raw/**/coverage.cobertura.xml"
          -targetdir:TestResults/coverage/report
          -reporttypes:"MarkdownSummaryGithub;Html"
          -assemblyfilters:"+ResourceReservation.Api"
          -classfilters:"-ResourceReservation.Api.Migrations.*"

      - name: Publish coverage summary
        run: cat TestResults/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: TestResults/coverage/report

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/resource-reservation-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/resource-reservation-client
        run: npm ci

      - name: Lint frontend
        working-directory: frontend/resource-reservation-client
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/resource-reservation-client
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend/resource-reservation-client
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        working-directory: frontend/resource-reservation-client
        run: npm run test:smoke
