name: Build

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore backend/ResourceReservation.Api/ResourceReservation.Api.csproj

      - name: Build backend
        run: dotnet build backend/ResourceReservation.Api/ResourceReservation.Api.csproj --no-restore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/resource-reservation-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/resource-reservation-client
        run: npm ci

      - name: Build frontend
        working-directory: frontend/resource-reservation-client
        run: npm run build
