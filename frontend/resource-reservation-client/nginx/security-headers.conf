# Security headers for the frontend's pages and files. Included in each
# location, because a location's own add_header discards the server's.
#
# Scripts come only from this origin, plus the inline theme script in
# index.html, allowed by its hash. The image build replaces
# @CSP_SCRIPT_HASHES@ with the hashes from the built index.html.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' @CSP_SCRIPT_HASHES@; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts_header always;
