# The whole system: SQL Server, migrations, the API and nginx.
#
#   cp .env.example .env          # then fill in the secrets
#   sh deploy/create-dev-certificate.sh
#   docker compose up --build
#
# Then open PUBLIC_ORIGIN, https://localhost:8443 by default. See
# docs/deployment.md for production.
#
# Only nginx publishes ports. SQL Server and the API are reachable only on
# their private networks.

name: resource-reservation

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      # Express is free for production use. Set your licensed edition otherwise.
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - db-data:/var/opt/mssql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Applies pending migrations with the migration bundle, then exits.
  migrator:
    image: ${IMAGE_PREFIX:-resource-reservation}-migrator:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Database=ResourceReservation;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  # Creates the API's own login, which can read and write data but not change
  # the schema. Uses sqlcmd from the SQL Server image, then exits.
  db-login:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "db", "-U", "sa", "-C", "-b", "-i", "/scripts/app-login.sql"]
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      DatabaseName: ResourceReservation
      AppLogin: resource_reservation_api
      AppPassword: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./deploy/sql/app-login.sql:/scripts/app-login.sql:ro
    networks:
      - data
    depends_on:
      migrator:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    image: ${IMAGE_PREFIX:-resource-reservation}-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Database=ResourceReservation;User Id=resource_reservation_api;Password=${APP_DB_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-ResourceReservation.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-ResourceReservation.Client}
      # Only nginx's fixed address is trusted to forward the client's IP and scheme.
      ReverseProxy__KnownProxies__0: ${PROXY_IP:-172.31.250.10}
      Frontend__BaseUrl: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      # Until real email delivery exists, emails are written to a volume.
      Email__Delivery: PickupDirectory
      Email__PickupDirectory: /var/lib/resource-reservation/emails
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in .env}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - api-emails:/var/lib/resource-reservation/emails
    networks:
      - data
      - proxy
    depends_on:
      db-login:
        condition: service_completed_successfully
    # Ready means the database is reachable. The image has no curl, so this
    # sends the request with bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Serves the frontend and proxies /api and /health to the API over HTTPS.
  web:
    image: ${IMAGE_PREFIX:-resource-reservation}-web:${IMAGE_TAG:-local}
    build:
      context: frontend/resource-reservation-client
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    networks:
      proxy:
        ipv4_address: ${PROXY_IP:-172.31.250.10}
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  # nginx and the API. nginx's address is fixed, so the API can trust it alone.
  # Other containers get addresses from ip_range only, so none can take it.
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.31.250.0/24}
          ip_range: ${PROXY_IP_RANGE:-172.31.250.128/25}
  # The database and everything that uses it. No internet access.
  data:
    internal: true

volumes:
  db-data:
  api-emails:
